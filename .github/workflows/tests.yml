name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number for an automated update
      head_sha:
        description: Expected pull request head commit SHA

concurrency:
  group: tap-tests-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pull_request || github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  checks: read
  contents: read
  pull-requests: read

jobs:
  test-bot:
    name: ${{ matrix.name }}
    # The updater dispatches this workflow for the exact head commit it just
    # pushed, so the pull_request event would only duplicate that run.
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'automation/package-updates'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 26 ARM64
            os: macos-26
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
          - name: Linux x86-64
            os: ubuntu-24.04
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@c8707045ccae42888fe98e86f2ee8938bc7cc193
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Detect changed package types
        id: changes
        if: github.event_name == 'pull_request' || inputs.pull_request != ''
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          tap_path="$(brew --repo "$GITHUB_REPOSITORY")"
          git -C "$tap_path" fetch --no-tags origin "$BASE_REF"
          comparison="origin/$BASE_REF...HEAD"

          if git -C "$tap_path" diff --quiet "$comparison" -- Formula; then
            echo "formulae=false" >> "$GITHUB_OUTPUT"
          else
            echo "formulae=true" >> "$GITHUB_OUTPUT"
          fi

          if git -C "$tap_path" diff --quiet "$comparison" -- Casks; then
            echo "casks=false" >> "$GITHUB_OUTPUT"
          else
            echo "casks=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build changed formulae
        if: >-
          (github.event_name == 'pull_request' || inputs.pull_request != '') &&
          steps.changes.outputs.formulae == 'true'
        run: brew test-bot --only-formulae --fail-fast

      - name: Install and uninstall changed casks
        if: >-
          (github.event_name == 'pull_request' || inputs.pull_request != '') &&
          matrix.os == 'macos-26' &&
          steps.changes.outputs.casks == 'true'
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          tap_path="$(brew --repo "$GITHUB_REPOSITORY")"
          git -C "$tap_path" diff --name-only "origin/$BASE_REF...HEAD" -- 'Casks/*.rb' |
            while IFS= read -r path; do
              token="${path##*/}"
              token="${token%.rb}"
              brew audit --cask --strict "hanwenguo/tap/$token"
              brew install --cask "hanwenguo/tap/$token"
              case "$token" in
                browstay)
                  codesign --verify --deep --strict /Applications/Browstay.app
                  ;;
                emacs-ns-static*)
                  codesign --verify --deep --strict /Applications/Emacs.app
                  codesign --verify --deep --strict '/Applications/Emacs Client.app'
                  ;;
              esac
              brew uninstall --cask "$token"
            done

      - name: Reject skipped or failed formula builds
        if: >-
          (github.event_name == 'pull_request' || inputs.pull_request != '') &&
          steps.changes.outputs.formulae == 'true'
        run: |
          if grep -q '[^[:space:]]' skipped_or_failed_formulae-*.txt; then
            echo "Formulae skipped or failed during source builds:"
            cat skipped_or_failed_formulae-*.txt
            exit 1
          fi

      - name: Upload bottles as artifact
        if: >-
          always() &&
          (github.event_name == 'pull_request' || inputs.pull_request != '') &&
          steps.changes.outputs.formulae == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bottles_${{ matrix.os }}
          path: "*.bottle.*"
          if-no-files-found: error

  publish-automated-update:
    name: Publish automated update
    if: github.event_name == 'workflow_dispatch' && inputs.pull_request != '' && inputs.head_sha != ''
    needs: test-bot
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch head-SHA-verified brew pr-pull
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: >-
          gh workflow run publish.yml --ref main
          --field pull_request="$PULL_REQUEST"
          --field head_sha="$HEAD_SHA"
