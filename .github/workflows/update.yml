name: Check package updates

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: package-updater
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Update versions and checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ruby scripts/update_packages.rb

      - name: Create or refresh update pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          exec 3>>"$GITHUB_OUTPUT"
          if git diff --quiet -- Formula Casks
          then
            echo "No package updates found."
            echo "changed=false" >&3
            exit 0
          fi

          branch="automation/package-updates"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null
          then
            git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          fi

          git switch -c "$branch"
          git add Formula Casks
          git commit -m "chore: update Homebrew packages"
          git push --force-with-lease origin "HEAD:$branch"

          pull_request="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [[ -z "$pull_request" ]]
          then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update Homebrew packages" \
              --body "Automated upstream release update. The exact head commit is tested on all supported formula bottle platforms before publication."
            pull_request="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          fi

          head_sha="$(git rev-parse HEAD)"
          echo "changed=true" >&3
          echo "head_sha=$head_sha" >&3
          echo "pull_request=$pull_request" >&3

      - name: Test the exact update commit
        if: steps.pull-request.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.pull_request }}
        run: >-
          gh workflow run tests.yml --ref automation/package-updates
          --field pull_request="$PULL_REQUEST"
          --field head_sha="$HEAD_SHA"
